<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うんちきろく</title>
    <style>
        :root {
            --primary-color: #ff9f43;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background: white;
            max-width: 400px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: #6d4c41;
        }
        .section-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #555;
        }
        .selector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .option-btn {
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .option-btn .emoji {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 4px;
        }
        .option-btn.selected {
            background-color: #fff3e0;
            border-color: var(--primary-color);
            color: #e65100;
            font-weight: bold;
            transform: scale(1.03);
        }
        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3);
            transition: all 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(255, 159, 67, 0.3);
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #2e7d32;
            height: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>👶 うんちきろく</h1>

    <div class="section-title">1. かたさは？</div>
    <div class="selector-grid" id="hardnessGroup">
        <div class="option-btn" data-value="かたい">
            <span class="emoji">🪨</span>かたい
        </div>
        <div class="option-btn selected" data-value="ふつう">
            <span class="emoji">🍌</span>ふつう
        </div>
        <div class="option-btn" data-value="やわらかい">
            <span class="emoji">💧</span>ゆるめ
        </div>
    </div>

    <div class="section-title">2. 量は？</div>
    <div class="selector-grid" id="amountGroup">
        <div class="option-btn" data-value="すくない">
            <span class="emoji">✨</span>すくない
        </div>
        <div class="option-btn selected" data-value="ふつう">
            <span class="emoji">👍</span>ふつう
        </div>
        <div class="option-btn" data-value="おおい">
            <span class="emoji">💥</span>おおい
        </div>
    </div>

    <button class="submit-btn" onclick="saveRecord()">📝 記録する</button>
    
    <div class="message" id="msg"></div>
</div>

<script>
    // 選択状態を管理するスクリプト
    setupSelector('hardnessGroup');
    setupSelector('amountGroup');

    function setupSelector(groupId) {
        const container = document.getElementById(groupId);
        const buttons = container.getElementsByClassName('option-btn');
        
        for (let btn of buttons) {
            btn.addEventListener('click', function() {
                for (let b of buttons) b.classList.remove('selected');
                this.classList.add('selected');
            });
        }
    }

    // 記録ボタンを押したときの処理（スプレッドシート連携版）
    function saveRecord() {
        const now = new Date();
        const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

        const hardness = document.querySelector('#hardnessGroup .option-btn.selected').getAttribute('data-value');
        const amount = document.querySelector('#amountGroup .option-btn.selected').getAttribute('data-value');

        // 先ほど教えていただいたURLをあらかじめ設定しています
        const gasUrl = "https://script.google.com/macros/s/AKfycbx5i0HrAA4teg6AoiHhhACbw6aFaeJ0OvnALXywv7g0rq6owxU4QWWexLeeyhVD7m_O/exec";

        const data = { time: timeStr, hardness: hardness, amount: amount };

        document.getElementById('msg').innerText = "送信中...";

        // スプレッドシートにデータを送信
        fetch(gasUrl, {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.json())
        .then(result => {
            if(result.status === "success") {
                document.getElementById('msg').innerText = `SSに記録しました！ (${timeStr})`;
            } else {
                document.getElementById('msg').innerText = "エラーが発生しました";
            }
        })
        .catch(error => {
            document.getElementById('msg').innerText = "通信エラーが発生しました";
            console.error(error);
        });
    }
</script>

</body>
</html>
