<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うんちきろく</title>
    <style>
        :root {
            --primary-color: #ff9f43;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent; /* スマホのタップハイライトを無効化 */
        }
        .app-container {
            background: white;
            max-width: 400px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #6d4c41;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* 日時設定エリア */
        .datetime-area {
            background: #fdf6ed;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .datetime-area div {
            flex: 1;
        }
        .datetime-area label {
            display: block;
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .datetime-area input, .datetime-area select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
            box-sizing: border-box;
        }
        /* 選択肢のボタンデザイン */
        .selector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 4px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            user-select: none;
            /* スマホでの誤作動防止 */
            touch-action: manipulation; 
        }
        .option-btn .emoji {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 4px;
        }
        .option-btn.selected {
            background-color: #fff3e0;
            border-color: var(--primary-color);
            color: #e65100;
            font-weight: bold;
        }
        /* 記録ボタン */
        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3);
            touch-action: manipulation;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #2e7d32;
            line-height: 1.4;
            font-weight: bold;
            min-height: 40px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>👶 うんちきろく</h1>

    <div class="section-title">📅 いつした？</div>
    <div class="datetime-area">
        <div>
            <label>ひにち</label>
            <input type="date" id="logDate">
        </div>
        <div>
            <label>じかん</label>
            <select id="logHour"></select>
        </div>
    </div>

    <div class="section-title">1. かたさは？</div>
    <div class="selector-grid" id="hardnessGroup">
        <div class="option-btn" data-value="かたい">
            <span class="emoji">🪨</span>かたい
        </div>
        <div class="option-btn selected" data-value="ふつう">
            <span class="emoji">🍌</span>ふつう
        </div>
        <div class="option-btn" data-value="やわらかい">
            <span class="emoji">💧</span>ゆるめ
        </div>
    </div>

    <div class="section-title">2. 量は？</div>
    <div class="selector-grid" id="amountGroup">
        <div class="option-btn" data-value="すくない">
            <span class="emoji">✨</span>すくない
        </div>
        <div class="option-btn selected" data-value="ふつう">
            <span class="emoji">👍</span>ふつう
        </div>
        <div class="option-btn" data-value="おおい">
            <span class="emoji">💥</span>おおい
        </div>
    </div>

    <button class="submit-btn" id="submitBtn">📝 記録する</button>
    
    <div class="message" id="msg"></div>
</div>

<script>
    // 初期設定：画面を開いたときの日時をセット
    initDateTime();

    // 選択ボタンのスマホ対応イベント設定
    setupSelector('hardnessGroup');
    setupSelector('amountGroup');

    // 記録ボタンのクリックイベントを設定
    document.getElementById('submitBtn').addEventListener('click', saveRecord);

    function initDateTime() {
        const now = new Date();
        
        // 今日の日付をセット (YYYY-MM-DD)
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('logDate').value = `${yyyy}-${mm}-${dd}`;
        
        // 24時間分の選択肢を生成して今の時間をセット
        const hourSelect = document.getElementById('logHour');
        const currentHour = now.getHours();
        
        for (let i = 0; i < 24; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${i}時`;
            if (i === currentHour) opt.selected = true;
            hourSelect.appendChild(opt);
        }
    }

    function setupSelector(groupId) {
        const container = document.getElementById(groupId);
        const buttons = container.getElementsByClassName('option-btn');
        
        for (let btn of buttons) {
            // スマホの「touchstart」とPCの「click」両方に対応させて確実に入力できるように修正
            const eventType = window.ontouchstart !== undefined ? 'touchstart' : 'click';
            
            btn.addEventListener(eventType, function(e) {
                e.preventDefault(); // スマホのダブルタップズームなどの挙動を防ぐ
                for (let b of buttons) b.classList.remove('selected');
                this.classList.add('selected');
            });
        }
    }

    function saveRecord() {
        // 選択された日付と時間を取得して結合
        const selectedDate = document.getElementById('logDate').value;
        const selectedHour = document.getElementById('logHour').value;
        const timeStr = `${selectedDate} ${selectedHour}:00`; // 「2026-06-21 21:00」のような形式になります

        const hardness = document.querySelector('#hardnessGroup .option-btn.selected').getAttribute('data-value');
        const amount = document.querySelector('#amountGroup .option-btn.selected').getAttribute('data-value');

        const gasUrl = "https://script.google.com/macros/s/AKfycbx5i0HrAA4teg6AoiHhhACbw6aFaeJ0OvnALXywv7g0rq6owxU4QWWexLeeyhVD7m_O/exec";

        const data = { time: timeStr, hardness: hardness, amount: amount };

        document.getElementById('msg').innerText = "送信中...";

        fetch(gasUrl, {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.json())
        .then(result => {
            if(result.status === "success") {
                document.getElementById('msg').innerHTML = "いつもお疲れさまです！<br>記録ありがとうございます(*^-^*)";
            } else {
                document.getElementById('msg').innerText = "エラーが発生しました";
            }
        })
        .catch(error => {
            document.getElementById('msg').innerText = "通信エラーが発生しました";
            console.error(error);
        });
    }
</script>

</body>
</html>
